# HTTPS with nginx + Let's Encrypt (certbot).
# Usage:
#   1. Set DOMAIN and ACME_EMAIL in .env
#   2. ./docker/init-letsencrypt.sh
#   3. docker compose -f docker-compose.yml -f docker-compose.domain.yml up -d

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/conf.d/options-ssl-nginx.conf:/etc/nginx/ssl-options.conf:ro
      - ./docker/nginx/entrypoint-envsubst.sh:/docker-entrypoint.d/40-envsubst-domains.sh:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
      while :; do
        certbot renew --quiet --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done"

  app:
    environment:
      COOKIE_SECURE: "true"

volumes:
  certbot-www:
  certbot-certs:
